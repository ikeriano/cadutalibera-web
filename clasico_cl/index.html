@keyframes gfIn{0%{opacity:0;transform:scale(1.7)}14%{opacity:1;transform:scale(1)}86%{opacity:1}100%{opacity:0}}
.gfc{position:absolute;width:50px;height:50px;border-radius:50%;background:radial-gradient(#9aa0aa,#3a3e46);border:3px solid #c8ccd4;box-shadow:0 2px 4px #000;transition:all .3s}

<script>
(function () { var box = document.getElementById('clErr'), n = 0;
  function log(m) { if (n++ > 40) return; box.style.display = 'block'; box.textContent += (box.textContent ? '\n' : '') + m; }
  window.__clLog = log;
  window.addEventListener('error', function (e) { var t = e.target; if (t && t !== window && (t.src || t.href)) log('NO CARGA: ' + (t.src || t.href)); else log('ERROR JS: ' + (e.message || e) + (e.filename ? ' @ ' + String(e.filename).split('/').pop() + ':' + e.lineno + ':' + e.colno : '')); }, true);
  window.addEventListener('unhandledrejection', function (e) { var r = e.reason; if (r && /play\(\)|NotAllowed|interact|AbortError|NotSupported/i.test(String(r && (r.message || r)))) return; log('PROMESA: ' + (r && (r.stack || r.message) || r)); });
  setTimeout(function () { if (!window.__clPronto) log('Il gioco non si è avviato in 8 s / El juego no ha arrancado en 8 s. UA: ' + navigator.userAgent + ' · ' + innerWidth + 'x' + innerHeight + ' · layout=' + (typeof window.CL_LAYOUT) + ' seq=' + (typeof window.CL_SEQ) + ' dom=' + (typeof window.CL_DOMANDE)); }, 8000);
})();
</script>
