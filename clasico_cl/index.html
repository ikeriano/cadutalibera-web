html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Arial Black",Arial,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}

.prz{position:absolute;cursor:default}
#ring .slot{position:absolute;width:100px;height:103px;cursor:pointer}
.spin{animation:sp 2.5s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
